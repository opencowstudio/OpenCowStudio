# PostgreSQL datasource configuration metadata.
#
# This file is an example of the metadata consumed by `definePgConfig`. It is
# NOT loaded directly by pg-core; instead it documents the shape a project
# mirrors in code (see README). The structure is:
#
#   pool      -> shared connection-pool tuning applied to every node
#   databases -> map of dbName -> { master node, optional slave nodes }
#     node    -> a single PostgreSQL node (master or slave): url + credentials

# Shared pool metadata — applied to every node (master and slaves).
pool:
  max: 18                       # maximum number of clients in the pool
  min: 18                       # minimum number of clients kept alive
  idleTimeoutMillis: 600000     # idle timeout before a client is closed (ms)
  maxLifetimeSeconds: 1800      # max lifetime before a client is recycled (s)

# Database metadata — keyed by dbName (matches @PgEntity dbName option).
databases:
  # default database: one master node plus two read-replica (slave) nodes.
  default:
    # Master node — write path is always routed here.
    master:
      url: postgresql://localhost:5432/opencowstudio_dev
      username: postgres
      password: postgres
    # Read-replica nodes — reads are round-robined across these; omitted
    # (or empty) means reads fall back to the master.
    slaves:
      - url: postgresql://localhost:5432/opencowstudio_dev
        username: postgres
        password: postgres
      - url: postgresql://localhost:5432/opencowstudio_dev
        username: postgres
        password: postgres
